<div class="container-fluid pt-5 pb-5" style="margin-top: 80px; background-color: #c0c7da;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8">
        <div class="card shadow-lg border-3 border-dark rounded-4">
          <div class="card-body p-5">
            <!-- Header -->
            <div class="text-center mb-5">
              <h1 class="display-4 fw-bold text-dark mb-3">Contacto</h1>
              <p class="lead text-muted">¿Tienes alguna pregunta? No dudes en comunicarte con nosotros</p>
            </div>

            <!-- Formulario -->
            <form [formGroup]="form" (ngSubmit)="enviarFormulario()">
              <!-- Nombre -->
              <div class="mb-4">
                <label for="nombre" class="form-label fw-bold text-uppercase">Nombre *</label>
                <input
                  type="text"
                  class="form-control form-control-lg border-2"
                  id="nombre"
                  formControlName="nombre"
                  placeholder="Tu nombre completo"
                  [disabled]="cargando"
                />
                <small class="text-danger d-block mt-2" *ngIf="form.get('nombre')?.invalid && form.get('nombre')?.touched">
                  <span *ngIf="form.get('nombre')?.hasError('required')">El nombre es requerido</span>
                  <span *ngIf="form.get('nombre')?.hasError('minlength')">Mínimo 3 caracteres</span>
                </small>
              </div>

              <!-- Email -->
              <div class="mb-4">
                <label for="email" class="form-label fw-bold text-uppercase">Email *</label>
                <input
                  type="email"
                  class="form-control form-control-lg border-2"
                  id="email"
                  formControlName="email"
                  placeholder="tu@email.com"
                  [disabled]="cargando"
                />
                <small class="text-danger d-block mt-2" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
                  <span *ngIf="form.get('email')?.hasError('required')">El email es requerido</span>
                  <span *ngIf="form.get('email')?.hasError('email')">Ingresa un email válido</span>
                </small>
              </div>

              <!-- Asunto -->
              <div class="mb-4">
                <label for="asunto" class="form-label fw-bold text-uppercase">Asunto *</label>
                <input
                  type="text"
                  class="form-control form-control-lg border-2"
                  id="asunto"
                  formControlName="asunto"
                  placeholder="Motivo de tu mensaje"
                  [disabled]="cargando"
                />
                <small class="text-danger d-block mt-2" *ngIf="form.get('asunto')?.invalid && form.get('asunto')?.touched">
                  <span *ngIf="form.get('asunto')?.hasError('required')">El asunto es requerido</span>
                  <span *ngIf="form.get('asunto')?.hasError('minlength')">Mínimo 5 caracteres</span>
                </small>
              </div>

              <!-- Mensaje -->
              <div class="mb-4">
                <label for="mensaje" class="form-label fw-bold text-uppercase">Mensaje *</label>
                <textarea
                  class="form-control form-control-lg border-2"
                  id="mensaje"
                  formControlName="mensaje"
                  placeholder="Tu mensaje aquí..."
                  rows="7"
                  [disabled]="cargando"
                ></textarea>
                <small class="text-danger d-block mt-2" *ngIf="form.get('mensaje')?.invalid && form.get('mensaje')?.touched">
                  <span *ngIf="form.get('mensaje')?.hasError('required')">El mensaje es requerido</span>
                  <span *ngIf="form.get('mensaje')?.hasError('minlength')">Mínimo 10 caracteres</span>
                </small>
              </div>

              <!-- Botones -->
              <div class="d-grid gap-3 d-md-flex">
                <button
                  type="submit"
                  class="btn btn-enviar btn-lg flex-fill fw-bold text-uppercase"
                  [disabled]="cargando || form.invalid"
                >
                  {{ cargando ? 'Enviando...' : 'Enviar Mensaje' }}
                </button>
                <button
                  type="button"
                  class="btn btn-limpiar btn-lg flex-fill fw-bold text-uppercase"
                  (click)="limpiarFormulario()"
                  [disabled]="cargando"
                >
                  Limpiar
                </button>
              </div>
            </form>

            <!-- Mensaje de confirmación -->
            <div *ngIf="mensajeConfirmacion()" class="alert alert-success alert-dismissible fade show mt-4 mb-0" role="alert">
              <strong>{{ mensajeConfirmacion() }}</strong>
            </div>

            <!-- Mensaje de error -->
            <div *ngIf="mensajeError()" class="alert alert-danger alert-dismissible fade show mt-4 mb-0" role="alert">
              <strong>{{ mensajeError() }}</strong>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
