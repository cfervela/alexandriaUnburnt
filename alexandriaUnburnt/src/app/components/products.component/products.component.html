<div class="container mt-5 py-5">
  <button class="fab-btn" (click)="openModal()">
    <i class="bi bi-plus-circle"></i>
  </button>

  <!-- BOOKS GRID -->
  <div class="books-grid">
    <div class="book-card" *ngFor="let p of products()">
      <div class="book-cover">
        <img *ngIf="p.image && p.image !== 'STOCK'" [src]="p.image" [alt]="p.title" />
        <div *ngIf="!p.image || p.image === 'STOCK'" class="cover-placeholder">
          <span>{{ p.title[0] }}</span>
        </div>
      </div>
      <div class="book-info">
        <h3 class="book-title">{{ p.title }}</h3>
        <p class="book-author">{{ p.author }}</p>
        <span class="book-genre" [class]="'book-genre ' + getGenreClass(p.genre)">{{ p.genre }}</span>
        <p class="book-description">{{ p.description }}</p>
        <div class="book-meta">
          <span class="book-price">${{ p.price }}</span>
          <span class="book-stock">{{ p.stock }} in stock</span>
        </div>
        <div class="book-actions">
          <button class="btn-edit" (click)="edit(p)">
            <i class="bi bi-pencil-square"></i> Edit
          </button>
          <button class="btn-info" (click)="bookDetailPage(p.isbn)">
            <i class="bi bi-zoom-in"></i> Info
          </button>
          <button class="btn-delete" (click)="deleteProduct(p.isbn!)">
            <i class="bi bi-trash"></i> Delete
          </button>
        </div>
      </div>
    </div>

    <div *ngIf="products().length === 0" class="empty-state">
      <i class="bi bi-book"></i>
      <p>No books yet. Add one on the right hand corner! </p>
    </div>
  </div>

  <!-- MODAL OVERLAY -->
  <div class="modal-overlay" *ngIf="showModal" (click)="closeModal()">
    <div class="modal-box" (click)="$event.stopPropagation()">

      <div class="modal-header">
        <h5>{{ editing ? 'Edit Book' : 'Add Book' }}</h5>
        <button class="modal-close" (click)="closeModal()">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>

      <form (ngSubmit)="saveProduct()">
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-6">
              <input type="text" class="form-control" [(ngModel)]="product.isbn" name="isbn" placeholder="Book ISBN" required/>
            </div>
            <div class="col-md-6">
              <input type="text" class="form-control" [(ngModel)]="product.title" name="title" placeholder="Book Title" required/>
            </div>
            <div class="col-md-6">
              <input type="text" class="form-control" [(ngModel)]="product.author" name="author" placeholder="Book Author" required/>
            </div>
            <div class="col-md-6">
              <input type="text" class="form-control" [(ngModel)]="product.genre" name="genre" placeholder="Book Genre" required/>
            </div>
            <div class="col-md-6">
              <input type="text" class="form-control" [(ngModel)]="product.publisher" name="publisher" placeholder="Book Publisher" required/>
            </div>
            <div class="col-md-6">
              <input type="number" class="form-control" [(ngModel)]="product.price" name="price" placeholder="Price" required/>
            </div>
            <div class="col-md-6">
              <input type="number" class="form-control" [(ngModel)]="product.stock" name="stock" placeholder="Stock" required/>
            </div>
            <div class="col-12">
              <textarea class="form-control" [(ngModel)]="product.description" name="description" placeholder="Synopsis" rows="3"></textarea>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn cancelBtn" (click)="closeModal()">Cancel</button>
          <button type="submit" class="btn addBtn">
            {{ editing ? 'Update' : 'Add' }}
          </button>
        </div>
      </form>

    </div>
  </div>
</div>
